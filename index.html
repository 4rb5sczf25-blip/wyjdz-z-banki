<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04111D">
  <title>Wyjdź z bańki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #04111D; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: #E8F6F8; }
    a { color: inherit; text-decoration: none; }
    button, input { font-family: inherit; }
    input::placeholder { color: #8FB3BE; opacity: 1; }
    #stage { position: absolute; left: 50%; top: 50%; width: 390px; height: 844px; transform-origin: center center; overflow: hidden; background: linear-gradient(180deg, #0E4263 0%, #0A2A43 28%, #06182A 68%, #04111D 100%); }
    a, button { transition: transform .14s ease, filter .14s ease; }
    a:active, button:active { transform: scale(.96); filter: brightness(1.15); }
    
    .scan-spinner { width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid rgba(4, 32, 43, .25); border-top-color: #04202B; animation: scan-spin .75s linear infinite; }
    @keyframes scan-spin { to { transform: rotate(360deg); } }
    
    .mark-fact { border-bottom: 2px solid #5EE6D6; background: rgba(94, 230, 214, 0.12); }
    .mark-opinion { border-bottom: 2px dashed #F2C94C; background: rgba(242, 201, 76, 0.12); }
    .mark-emotion { text-decoration: underline wavy #FF7A66; text-underline-offset: 4px; background: rgba(255, 122, 102, 0.14); }
  </style>
</head>
<body>
  <div id="stage">
    <!-- EKRAN STARTOWY -->
    <div id="screen-main" style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: 28px 24px 0; gap: 12px; z-index: 10;">
      <header style="display: flex; align-items: center; gap: 12px;">
        <span style="width: 44px; height: 44px; border-radius: 999px; background: rgba(94,230,214,0.14); border: 1px solid rgba(94,230,214,0.55); color: #5EE6D6; display: flex; align-items: center; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="14" r="6"></circle><circle cx="18" cy="6" r="2.5"></circle></svg>
        </span>
        <div>
          <div style="font-size: 13px; font-weight: 600; color: #A9CBD4;">Analiza AI</div>
          <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 800;">Wyjdź z bańki</h1>
        </div>
      </header>

      <section style="margin-top: 20px; padding: 14px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); border-radius: 20px; display: flex; flex-direction: column; gap: 10px;">
        <div style="position: relative;">
          <textarea id="ai-input" placeholder="Wklej tekst do przeanalizowania przez AI..." style="width: 100%; height: 120px; box-sizing: border-box; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.28); background: rgba(4,17,29,0.6); color: #E8F6F8; font-size: 15px; resize: none;"></textarea>
        </div>
        <button type="button" id="btn-analyze" style="width: 100%; height: 48px; border: 0; border-radius: 14px; background: #5EE6D6; color: #04202B; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; cursor: pointer;">
          Analizuj wiadomość
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"></path></svg>
        </button>
      </section>
      
      <!-- Miejsce na komunikaty o błędach -->
      <div id="toast-msg" style="display: none; margin-top: 10px; padding: 12px; border-radius: 14px; background: rgba(255, 122, 102, 0.18); border: 1px solid rgba(255, 122, 102, 0.4); color: #FFB0A4; font-size: 14px; font-weight: 600; text-align: center;"></div>
    </div>

    <!-- EKRAN WYNIKOWY -->
    <div id="screen-result" style="position: absolute; inset: 0; display: none; flex-direction: column; padding: 28px 24px 24px; gap: 14px; z-index: 20;">
      <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <button type="button" id="btn-back" style="flex: none; width: 44px; height: 44px; padding: 0; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); color: #E8F6F8; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700;">Wynik analizy OpenAI</h1>
        <span style="width: 44px; height: 44px;"></span>
      </header>

      <section style="flex: 1; padding: 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); border-radius: 20px; font-size: 15px; line-height: 26px; font-weight: 500; overflow-y: auto;" id="result-content">
        <!-- Wynik zostanie wstawiony tutaj -->
      </section>

      <section style="flex: none; box-sizing: border-box; padding: 14px 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); border-radius: 20px;">
        <h2 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700;">Emocjonalność języka</h2>
        <div style="margin-top: 10px; display: flex; gap: 4px; height: 10px;" id="result-bars">
           <!-- Paski zostaną wstawione tutaj -->
        </div>
      </section>
    </div>
  </div>

  <script>
    const fit = () => { const s = Math.min(window.innerWidth/390, window.innerHeight/844, 1.6); document.getElementById('stage').style.transform = 'translate(-50%, -50%) scale(' + s + ')'; };
    window.addEventListener('resize', fit); fit();

    const screenMain = document.getElementById('screen-main');
    const screenResult = document.getElementById('screen-result');
    const btnAnalyze = document.getElementById('btn-analyze');
    const inputField = document.getElementById('ai-input');
    const toastMsg = document.getElementById('toast-msg');
    
    function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.style.display = 'block';
        setTimeout(() => { toastMsg.style.display = 'none'; }, 4000);
    }

    btnAnalyze.addEventListener('click', async () => {
      const rawText = inputField.value.trim();
      
      if (rawText.length < 20) {
        showToast('Wklej trochę dłuższy tekst, aby AI mogło go przeanalizować (minimum 20 znaków).');
        return;
      }
      
      // Stan wczytywania
      btnAnalyze.disabled = true;
      btnAnalyze.style.opacity = '0.7';
      btnAnalyze.innerHTML = '<span class="scan-spinner" aria-hidden="true"></span><span role="status">AI analizuje tekst...</span>';
      toastMsg.style.display = 'none';
      
      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: rawText })
        });
        
        if (!response.ok) throw new Error('Serwer zwrócił błąd');
        const data = await response.json();
        
        // Parsowanie wyniku
        let htmlContent = '';
        let countFact = 0, countOp = 0, countEm = 0;
        
        data.s.forEach(sentenceArray => {
            const type = sentenceArray[0];
            const text = sentenceArray[1];
            
            if(type === 'fact') { countFact++; htmlContent += `<span class="mark-fact">${text}</span> `; }
            else if(type === 'opinion') { countOp++; htmlContent += `<span class="mark-opinion">${text}</span> `; }
            else { countEm++; htmlContent += `<span class="mark-emotion">${text}</span> `; }
        });
        
        document.getElementById('result-content').innerHTML = htmlContent;
        
        // Paski proporcji
        const total = countFact + countOp + countEm || 1;
        document.getElementById('result-bars').innerHTML = `
            <div style="flex: ${countFact/total}; border-radius: 999px; background: #5EE6D6"></div>
            <div style="flex: ${countOp/total}; border-radius: 999px; background: #F2C94C"></div>
            <div style="flex: ${countEm/total}; border-radius: 999px; background: #FF7A66"></div>
        `;
        
        // Przejście na drugi ekran
        screenMain.style.display = 'none';
        screenResult.style.display = 'flex';
        
      } catch (err) {
        showToast('Wystąpił błąd komunikacji z OpenAI. Sprawdź, czy podpiąłeś poprawny klucz w Vercelu.');
      } finally {
        // Resetowanie przycisku
        btnAnalyze.disabled = false;
        btnAnalyze.style.opacity = '1';
        btnAnalyze.innerHTML = 'Analizuj wiadomość <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"></path></svg>';
      }
    });

    document.getElementById('btn-back').addEventListener('click', () => {
        screenResult.style.display = 'none';
        screenMain.style.display = 'flex';
        inputField.value = '';
    });
  </script>
</body>
</html>
