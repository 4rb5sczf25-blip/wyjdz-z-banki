function newsCounts(a){const c={fact:0,opinion:0,emotion:0};a.s.forEach(x=>c[x[0]]++);return c}
function newsTag(a){const c=newsCounts(a);const k=['fact','opinion','emotion'].reduce((m,k)=>c[k]>c[m]?k:m,'fact');return Object.assign({key:k},NEWS_TAGS[k])}
function newsHead(a){const out=[];a.head.replace(/\[(e|o)\](.*?)\[\/\1\]|([^\[]+)/g,(_,k,t,p)=>{out.push(p!=null?{text:p,css:''}:{text:t,css:NEWS_MARK[k==='e'?'emotion':'opinion']})});return out}
function newsBar(p){return p<=33?'#5EE6D6':(p<=66?'#F2C94C':'#FF7A66')}

s Component extends DCLogic {\n  renderVals() {\n    const ev = curEvent();\n    const all = ev.articles.length, n = ev.featured.length;\n    const pl = (k) => (k === 1 ? 'źródło' : (k % 10 >= 2 && k % 10 <= 4 && (k % 100 < 12 || k % 100 > 14)) ? 'źródła' : 'źródeł');\n    const cards = ev.featured.map((id) => {\n      const a = ev.articles.find((x) => x.id === id);\n      const t = newsTag(a);\n      return {\n        name: a.name, head: newsHead(a), pct: a.pct + '%', barColor: newsBar(a.pct),\n        tagLabel: t.label, tagBg: t.bg, tagColor: t.color, tagIcon: t.icon,\n        open: () => select({ src: a.id, from: 'Compare' }),\n      };\n    });\n    return {\n      title: ev.title,\n      sub: (n < all ? n + ' z ' + all + ' źródeł' : n + ' ' + pl(n)) + ' · przykładowe dane i fikcyjne media',\n      cards: cards,\n      allLabel: 'Zobacz wszystkie ' + all + ' ' + pl(all),\n    };\n  }\n}\n"}, "Article": {"html": "<div style=\"position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(180deg, #0E4263 0%, #0A2A43 28%, #06182A 68%, #04111D 100%); color: #E8F6F8; font-family: 'Manrope', system-ui, sans-serif\">\n\n  <svg width=\"390\" height=\"844\" viewBox=\"0 0 390 844\" aria-hidden=\"true\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\">\n    <defs>\n      <linearGradient id=\"rays-art\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#9FF3EA\" stop-opacity=\"0.15\"/>\n        <stop offset=\"1\" stop-color=\"#9FF3EA\" stop-opacity=\"0\"/>\n      <\/linearGradient>\n    <\/defs>\n    <polygon points=\"30,0 100,0 200,400 70,400\" fill=\"url(#rays-art)\"/>\n    <circle cx=\"358\" cy=\"120\" r=\"14\" fill=\"rgba(94,230,214,0.05)\" stroke=\"#5EE6D6\" stroke-opacity=\"0.3\" stroke-width=\"1.5\"/>\n    <circle cx=\"370\" cy=\"620\" r=\"20\" fill=\"none\" stroke=\"#5EE6D6\" stroke-opacity=\"0.22\" stroke-width=\"1.5\"/>\n ra', 'Manrope', system-ui, sans-serif; font-size: 20px; line-height: 26px; font-weight: 800; color: #FFB0A4\">{{ nEm }}<\/span> <span style=\"font-size: 13px; font-weight: 600; color: #A9CBD4\">{{ lEm }}<\/span><\/div>\n      <\/div>\n    <\/section>\n\n    <section style=\"flex: none; display: flex; flex-direction: column; gap: 8px\">\n      <h2 style=\"margin: 0; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700\">Źródła i oryginały<\/h2>\n      <sc-for list=\"{{ docs }}\" as=\"dc\" hint-placeholder-count=\"2\">\n      <button type=\"button\" style=\"box-sizing: border-box; width: 100%; min-height: 52px; padding: 8px 12px; display: flex; align-items: center; gap: 12px; text-align: left; border-radius: 16px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.07); color: #E8F6F8; cursor: pointer\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5EE6D6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none\"><path d=\"{{ dc.icon }}\"/><\/svg>\n        <span style=\"flex: 1; min-width: 0\"><span style=\"display: block; font-size: 14px; line-height: 20px; font-weight: 700\">{{ dc.title }}<\/span><span style=\"display: block; font-size: 12px; line-height: 16px; font-weight: 600; color: #A9CBD4\">{{ dc.kind }}<\/span><\/span>\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A9CBD4\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none\"><path d=\"M9 6l6 6-6 6\"/><\/svg>\n      <\/button>\n      <\/sc-for>\n    <\/section>\n\n  <\/div>\n\n  <nav aria-label=\"Nawigacja\" style=\"position: relative; box-sizing: border-box; height: 84px; padding: 8px 12px 20px; background: rgba(4,17,29,0.92); border-top: 1px solid rgba(255,255,255,0.12); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))\">\n    <a href=\"Main.dc.html\" style=\"min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9CBD4; font-size: 12px; line-height: 16px; font-weight: 700; text-decoration: none\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"14\" r=\"6\"/><circle cx=\"18\" cy=\"6\" r=\"2.5\"/><\/svg>\n      Start\n    <\/a>\n    <a href=\"Compare.dc.html\" style=\"min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9CBD4; font-size: 12px; line-height: 16px; font-weight: 700; text-decoration: none\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"12\" r=\"6\"/><circle cx=\"15\" cy=\"12\" r=\"6\"/><\/svg>\n      Porównaj\n    <\/a>\n    <a href=\"Article.dc.html\" aria-current=\"page\" style=\"min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5EE6D6; font-size: 12px; line-height: 16px; font-weight: 800; text-decoration: none\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"M16 16l5 5\"/><\/svg>\n      Analiza\n    <\/a>\n    <a href=\"Learn.dc.html\" style=\"min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9CBD4; font-size: 12px; line-height: 16px; font-weight: 700; text-decoration: none\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h7a1 1 0 0 1 1 1v14a1 1 0 0 0-1-1H4zM20 5h-7a1 1 0 0 0-1 1v14a1 1 0 0 1 1-1h7z\"/><\/svg>\n      Nauka\n    <\/a>\n  <\/nav>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    const st = this.state || {};\n    const ev = curEvent();\n    const a = curArticle();\n    const key = SEL.ev + ':' + a.id;\n    const focus = st.key === key ? (st.focus || '') : '';\n    const kinds = {\n      fact: { label: 'Fakt', css: 'border-bottom: 2px solid #5EE6D6; background: rgba(94,230,214,0.12);' },\n      opinion: { label: 'Opinia', css: NEWS_MARK.opinion },\n      emotion: { label: 'Emocje', css: NEWS_MARK.emotion },\n    };\n    const counts = newsCounts(a);\n    const tag = newsTag(a);\n    const pl = (n, one, few, many) => (n === 1 ? one : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? few : many);\n    const sentences = a.s.map((d) => ({ text: d[1], css: focus && focus !== d[0] ? 'opacity: 0.4;' : kinds[d[0]].css }));\n    const chips = ['fact', 'opinion', 'emotion'].map((k) => {\n      const on = focus === k;\n      let css = kinds[k].css;\n      if (on) { css += ' outline: 2px solid #E8F6F8; outline-offset: 2px;'; }\n      else if (focus) { css += ' opacity: 0.6;'; }\n      return {\n        label: kinds[k].label + ' · ' + counts[k], css: css, on: on,\n        toggle: () => { const s = this.state || {}; const cur = s.key === key ? (s.focus || '') : ''; this.setState({ key: key, focus: cur === k ? '' : k }); },\n      };\n    });\n    const colors = { fact: '#5EE6D6', opinion: '#F2C94C', emotion: '#FF7A66' };\n    const bars = ['fact', 'opinion', 'emotion'].filter((k) => counts[k] > 0).map((k) => ({ flex: counts[k], color: colors[k] }));\n    const icons = { doc: 'M6 3h9l4 4v14H6zM9 12h7M9 16h7', data: 'M5 20V10M12 20V4M19 20v-7' };\n    const fromSources = SEL.from === 'Sources';\n    return {\n      chips: chips, sentences: sentences, bars: bars,\n      outlet: a.name, date: '· ' + ev.date, head: newsHead(a),\n      tagLabel: tag.label, tagBg: tag.bg, tagColor: tag.color, tagIcon: tag.icon,\n      nFact: counts.fact, lFact: pl(counts.fact, 'fakt', 'fakty', 'faktów'),\n      nOp: counts.opinion, lOp: pl(counts.opinion, 'opinia', 'opinie', 'opinii'),\n      nEm: counts.emotion, lEm: pl(counts.emotion, 'fraza emocji', 'frazy emocji', 'fraz emocji'),\n      docs: ev.docs.map((d) => ({ icon: icons[d[0]], title: d[1], kind: d[2] })),\n      backHref: fromSources ? 'Sources.dc.html' : 'Compare.dc.html',\n      backLabel: fromSources ? 'Wróć do bazy źródeł' : 'Wróć do porównania',\n    };\n  }\n}\n"}, "Quiz": {"html": "<div style=\"position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(180deg, #0E4263 0%, #0A2A43 28%, #06182A 68%, #04111D 100%); color: #E8F6F8; font-family: 'Manrope', system-ui, sans-serif\">\n\n  <svg width=\"390\" height=\"844\" viewBox=\"0 0 390 844\" aria-hidden=\"true\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\">\n    <defs>\n      <linearGradient id=\"rays-quiz\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#9FF3EA\" stop-opacity=\"0.15\"/>\n        <stop offset=\"1\" stop-color=\"#9FF3EA\" stop-opacity=\"0\"/>\n      <\/linearGradient>\n    <\/defs>\n    <polygon points=\"250,0 330,0 390,380 280,380\" fill=\"url(#rays-quiz)\"/>\n    <circle cx=\"30\" cy=\"150\" r=\"12\" fill=\"none\" stroke=\"#5EE6D6\" stroke-opacity=\"0.28\" stroke-width=\"1.5\"/>\n    <circle cx=\"362\" cy=\"560\" r=\"22\" fill=\"rgba(94,230,214,0.04)\" stroke=\"#5EE6D6\" stroke-opacity=\"0.25\" stroke-width=\"1.5\"/>\n    <circle cx=\"372\" cy=\"520\" r=\"7\" fill=\"none\" stroke=\"#5EE6D6\" stroke-opacity=\"0.25\" stroke-width=\"1.5\"/>\n  <\/svg>\n\n  <div style=\"position: relative; flex: 1; min-height: 0; box-sizing: border-box; padding: 28px 24px 0; "flex: none; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center\">\n            <sc-if value=\"{{ o.isCorrect }}\" hint-placeholder-val=\"{{ false }}\">\n              <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5EE6D6\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M7.5 12.5l3 3 6-7\"/><\/svg>\n            <\/sc-if>\n            <sc-if value=\"{{ o.isWrong }}\" hint-placeholder-val=\"{{ false }}\">\n              <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FF8F7F\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M8.5 8.5l7 7M15.5 8.5l-7 7\"/><\/svg>\n            <\/sc-if>\n            <sc-if value=\"{{ o.idle }}\" hint-placeholder-val=\"{{ true }}\">\n              <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A9CBD4\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><\/svg>\n            <\/sc-if>\n          <\/span>\n          <span style=\"flex: 1; min-width: 0\">\n            <span style=\"display: block; font-size: 16px; line-height: 22px; font-weight: 800\">{{ o.label }}<\/span>\n            <span style=\"display: block; font-size: 13px; line-height: 18px; font-weight: 600; color: #B9D6DE\">{{ o.sub }}<\/span>\n          <\/span>\n        <\/button>\n      <\/sc-for>\n    <\/div>\n\n    <sc-if value=\"{{ answered }}\" hint-placeholder-val=\"{{ false }}\">\n      <section aria-live=\"polite\" style=\"box-sizing: border-box; padding: 14px 16px; border-radius: 18px; background: {{ fbBg }}; border: 1px solid {{ fbBorder }}\">\n        <div style=\"font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 16px; line-height: 22px; font-weight: 700\">{{ fbTitle }}<\/div>\n        <div style=\"margin-top: 4px; font-size: 14px; line-height: 20px; font-weight: 500\">{{ fbText }}<\/div>\n      <\/section>\n    <\/sc-if>\n\n    <sc-if value=\"{{ answered }}\" hint-placeholder-val=\"{{ false }}\">\n      <button type=\"button\" onClick=\"{{ next }}\" style=\"width: 100%; height: 52px; border: 0; border-radius: 16px; background: #5EE6D6; color: #04202B; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; cursor: pointer\">\n        {{ nextLabel }}\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg>\n      <\/button>\n    <\/sc-if>\n    <\/sc-if>\n\n    <sc-if value=\"{{ finished }}\" hint-placeholder-val=\"{{ false }}\">\n      <header>\n        <div style=\"font-size: 13px; line-height: 18px; font-weight: 600; color: #A9CBD4\">Quiz zakończony<\/div>\n        <h1 style=\"margin: 0; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -0.3px\">Twój wynik<\/h1>\n      <\/header>\n\n      <section aria-live=\"polite\" style=\"box-sizing: border-box; padding: 20px 16px; text-align: center; background: rgba(94,230,214,0.12); border: 1px solid rgba(94,230,214,0.5); border-radius: 22px\">\n        <div style=\"font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 56px; line-height: 62px; font-weight: 800; color: #7FF0E0\">{{ score }}<span style=\"font-size: 28px; color: #B9D6DE\"> / {{ total }}<\/span><\/div>\n        <div style=\"margin-top: 4px; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 18px; line-height: 24px; font-weight: 700\">{{ verdict }}<\/div>\n        <div style=\"margin-top: 6px; font-size: 14px; line-height: 20px; font-weight: 500; color: #CFE6EC\">{{ verdictText }}<\/div>\n      <\/section>\n\n      <div role=\"list\" aria-label=\"Odpowiedzi w quizie\" style=\"display: flex; flex-direction: column; gap: 8px\">\n        <sc-for list=\"{{ review }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <div role=\"listitem\" style=\"box-sizing: border-box; min-height: 44px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; border-radius: 14px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16)\">\n            <sc-if value=\"{{ r.ok }}\" hint-placeholder-val=\"{{ true }}\">\n              <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5EE6D6\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M7.5 12.5l3 3 6-7\"/><\/svg>\n            <\/sc-if>\n            <sc-if value=\"{{ r.bad }}\" hint-placeholder-val=\"{{ false }}\">\n              <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FF8F7F\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M8.5 8.5l7 7M15.5 8.5l-7 7\"/><\/svg>\n            <\/sc-if>\n            <span style=\"flex: 1; min-width: 0; font-size: 14px; line-height: 18px; font-weight: 700\">{{ r.text }}<\/span>\n            <span style=\"flex: none; font-size: 12px; font-weight: 700; color: #B9D6DE\">{{ r.status }}<\/span>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n\n      <div style=\"display: flex; gap: 10px\">\n        <button type=\"button\" onClick=\"{{ restart }}\" style=\"flex: 1; height: 52px; border: 0; border-radius: 16px; background: #5EE6D6; color: #04202B; font-size: 16px; font-weight: 800; cursor: pointer\">Zagraj ponownie<\/button>\n        <a href=\"Achievements.dc.html\" style=\"flex: 1; height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid rgba(242,201,76,0.6); background: rgba(242,201,76,0.14); color: #F5D874; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; text-decoration: none\">Osiągnięcia<\/a>\n      <\/div>\n    <\/sc-if>\n\n  <\/div>\n\n  <nav aria-label=\"Nawigacja\" style=\"position: relative; box-sizing: border-box; height: 84px; padding: 8px 12px 20px; background: rgba(4,17,29,0.92); border-top: 1px solid rgba(255,255,255,0.12); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))\">\n    <a href=\"Main.dc.html\" style=\"min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9CBD4; font-size: 12px; line-height: 16px; font-weight: 700; text-decoration: none\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"14\" r=\"6\"/><circle cx=\"18\" cy=\"6\" r=\"2.5\"/><\/svg>\n      Start\n    <\/a>\n    <a href=\"Compare.dc.html\" style=\"min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9CBD4; font-size: 12px; line-height: 16px; font-weight: 700; text-decoration: none\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"12\" r=\"6\"/><circle cx=\"15\" cy=\"12\" r=\"6\"/><\/svg>\n      Porównaj\n    <\/a>\n    <a href=\"Article.dc.html\" style=\"min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9CBD4; font-size: 12px; line-height: 16px; font-weight: 700; text-decoration: none\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"M16 16l5 5\"/><\/svg>\n      Analiza\n    <\/a>\n    <a href=\"Learn.dc.html\" aria-current=\"page\" style=\"min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5EE6D6; font-size: 12px; line-height: 16px; font-weight: 800; text-decoration: none\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h7a1 1 0 0 1 1 1v14a1 1 0 0 0-1-1H4zM20 5h-7a1 1 0 0 0-1 1v14a1 1 0 0 1 1-1h7z\"/><\/svg>\n      Nauka\n    <\/a>\n  <\/nav>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    const QS = [\n      { title: 'Fakt czy opinia?', source: 'Zdanie z nagłówka', prompt: '„Sejm przyjął nowelizację ustawy 238 głosami za.”', correct: 'fact', short: 'Wynik głosowania w Sejmie',\n        opts: [ { id: 'fact', label: 'Fakt', hint: 'Da się to sprawdzić w danych lub dokumentach' }, { id: 'opinion', label: 'Opinia', hint: 'To ocena lub pogląd autora' }, { id: 'unknown', label: 'Nie da się ustalić', hint: 'Brakuje kontekstu' } ],\n        why: 'Wynik głosowania jest zapisany w protokole Sejmu, więc można go sprawdzić. To fakt.' },\n      { title: 'Fakt czy opinia?', source: 'Zdanie z wpisu w mediach społecznościowych', prompt: '„Ta ustawa to najgorsza decyzja Sejmu od lat.”', correct: 'opinion', short: 'Wpis o „najgorszej decyzji”',\n        opts: [ { id: 'fact', label: 'Fakt', hint: 'Da się to sprawdzić w danych lub dokumentach' }, { id: 'opinion', label: 'Opinia', hint: 'To ocena lub pogląd autora' }, { id: 'unknown', label: 'Nie da się ustalić', hint: 'Brakuje kontekstu' } ],\n        why: 'Słowo „najgorsza” to ocena autora. Nie da się jej sprawdzić w dokumentach ani danych, więc to opinia.' },\n      { title: 'Język emocjonalny', source: 'Tytuł z portalu informacyjnego', prompt: '„Skandaliczna ustawa uderzy w zwykłych Polaków!”', correct: 'emo', short: 'Tytuł ze „skandaliczną ustawą”',\n        opts: [ { id: 'neutral', label: 'Neutralny opis', hint: 'Bez ocen i nacechowanych słów' }, { id: 'emo', label: 'Język emocjonalny', hint: 'Słowa budzące emocje zamiast faktów' }, { id: 'fact', label: 'Sprawdzalny fakt', hint: 'Da się to zweryfikować w danych' } ],\n        why: 'Słowa „skandaliczna” i „uderzy” oraz wykrzyknik mają wzbudzić emocje. Tytuł nie podaje żadnych sprawdzalnych danych.' },\n      { title: 'Źródło informacji', source: 'Fragment artykułu', prompt: '„Według anonimowych źródeł w rządzie ustawa może zostać zmieniona.”', correct: 'unknown', short: 'Anonimowe źródła w rządzie',\n        opts: [ { id: 'fact', label: 'Potwierdzony fakt', hint: 'Jest dokument lub dane' }, { id: 'opinion', label: 'Opinia autora', hint: 'To ocena autora tekstu' }, { id: 'unknown', label: 'Nie da się ustalić', hint: 'Nie można sprawdzić źródła' } ],\n        why: 'Anonimowego źródła nie da się zweryfikować, a słowo „może” nic nie przesądza. Z tego zdania nie wiemy, czy to prawda.' },\n      { title: 'Fakt czy opinia?', source: 'Zdanie z serwisu informacyjnego', prompt: '„Bezrobocie spadło w tym roku do 5,1%, podał GUS.”', correct: 'fact', short: 'Dane GUS o bezrobociu',\n        opts: [ { id: 'fact', label: 'Fakt', hint: 'Da się to sprawdzić w danych lub dokumentach' }, { id: 'opinion', label: 'Opinia', hint: 'To ocena lub pogląd autora' }, { id: 'unknown', label: 'Nie da się ustalić', hint: 'Brakuje kontekstu' } ],\n        why: 'Liczba ma wskazane źródło (GUS) i można ją sprawdzić w publicznych danych. To fakt.' },\n    ];\n    const total = QS.length;\n    const st = this.state || {};\n    const idx = st.idx || 0;\n    const picked = st.picked || '';\n    const answers = st.answers || [];\n    const finished = !!st.done;\n    const inQuiz = !finished;\n    const q = QS[Math.min(idx, total - 1)];\n    const answered = picked !== '';\n    const options = q.opts.map((d) => {\n      const isCorrect = answered && d.id === q.correct;\n      const isWrong = answered && picked === d.id && d.id !== q.correct;\n      let bg = 'rgba(255,255,255,0.07)';\n      let border = 'rgba(255,255,255,0.22)';\n      let sub = d.hint;\n      if (isCorrect) { bg = 'rgba(94,230,214,0.18)'; border = '#5EE6D6'; sub = 'Poprawna odpowiedź'; }\n      if (isWrong) { bg = 'rgba(255,122,102,0.18)'; border = '#FF7A66'; sub = 'Twój wybór, ale to nie ta odpowiedź'; }\n      return {\n        label: d.label, sub: sub, bg: bg, border: border,\n        isCorrect: isCorrect, isWrong: isWrong, idle: !isCorrect && !isWrong,\n        pick: () => {\n          const s = this.state || {};\n          if (s.picked) { return; }\n          const i = s.idx || 0;\n          const arr = (s.answers || []).slice();\n          arr[i] = (d.id === QS[i].correct);\n          this.setState({ picked: d.id, answers: arr });\n        },\n      };\n    });\n    const ok = answered && picked === q.correct;\n    const segs = QS.map((_, i) => {\n      let bg = 'rgba(255,255,255,0.25)';\n      if (i < idx || (i === idx && answered)) { bg = answers[i] ? '#5EE6D6' : '#FF7A66'; }\n      else if (i === idx) { bg = '#F2C94C'; }\n      return { bg: bg };\n    });\n    const score = answers.filter((x) => x).length;\n    const verdicts = [\n      ['Warto powtórzyć', 'Spróbuj jeszcze raz. Zwracaj uwagę na słowa, które oceniają, zamiast opisywać.'],\n      ['Warto powtórzyć', 'Spróbuj jeszcze raz. Zwracaj uwagę na słowa, które oceniają, zamiast opisywać.'],\n      ['Dobry początek', 'Rozpoznajesz podstawy. Przyjrzyj się pytaniom, w których pojawił się błąd.'],\n      ['Dobrze Ci idzie', 'Większość zdań rozpoznajesz trafnie. Jeszcze trochę do rafy.'],\n      ['Świetnie!', 'Prawie bezbłędnie odróżniasz fakty od opinii i emocji.'],\n      ['Mistrz bańki!', 'Komplet punktów. Rozpoznajesz fakty, opinie i emocje bez pudła.'],\n    ];\n    const v = verdicts[score];\n    const review = QS.map((x, i) => ({\n      text: (i + 1) + '. ' + x.short,\n      ok: !!answers[i],\n      bad: !answers[i],\n      status: answers[i] ? 'Dobrze' : 'Błąd',\n    }));\n    return {\n      inQuiz: inQuiz,\n      finished: finished,\n      counter: 'Pytanie ' + (idx + 1) + ' z ' + total,\n      title: q.title,\n      source: q.source,\n      prompt: q.prompt,\n      segs: segs,\n      options: options,\n      answered: answered,\n      fbBg: ok ? 'rgba(94,230,214,0.12)' : 'rgba(255,122,102,0.12)',\n      fbBorder: ok ? 'rgba(94,230,214,0.6)' : 'rgba(255,122,102,0.6)',\n      fbTitle: ok ? 'Dobrze!' : 'Nie tym razem.',\n      fbText: q.why,\n      nextLabel: idx >= total - 1 ? 'Zobacz wynik' : 'Następne pytanie',\n      next: () => {\n        const s = this.state || {};\n        const i = s.idx || 0;\n        if (i >= total - 1) { this.setState({ done: true }); }\n        else { this.setState({ idx: i + 1, picked: '' }); }\n      },\n      score: score,\n      total: total,\n      verdict: v[0],\n      verdictText: v[1],\n      review: review,\n      restart: () => { this.setState({ idx: 0, picked: '', answers: [], done: false }); },\n    };\n  }\n}"}, "QuizFeedback": {"html": "<div style=\"position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(180deg, #0E4263 0%, #0A2A43 28%, #06182A 68%, #04111D 100%); color: #E8F6F8; font-family: 'Manrope', system-ui, sans-serif\">\n\n  <svg width=\"390\" height=\"844\" viewBox=\"0 0 390 844\" aria-hidden=\"true\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\">\n    <defs>\n      <linearGradient id=\"rays-qf\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#9FF3EA\" stop-opacity=\"0.15\"/>\n        <stop offset=\"1\" stop-color=\"#9FF3EA\" stop-opacity=\"0\"/>\n      <\/linearGradient>\n    <\/defs>\n    <polygon points=\"250,0 330,0 390,380 280,380\" fill=\"url(#rays-qf)\"/>\n    <circle cx=\"30\" cy=\"150\" r=\"12\" fill=\"none\" stroke=\"#5EE6D6\" stroke-opacity=\"0.28\" stroke-width=\"1.5\"/>\n    <circle cx=\"364\" cy=\"610\" r=\"22\" fill=\"rgba(94,230,214,0.04)\" stroke=\"#5EE6D6\" stroke-opacity=\"0.25\" stroke-width=\"1.5\"/>\n  <\/svg>\n\n  <div style=\"position: relative; flex: 1; min-height: 0; box-sizing: border-box; padding: 28px 24px 0; display: flex; flex-direction: column; gap: 12px\">\n\n    <header>\n      <div style=\"font-size: 13px; line-height: 18px; font-weight: 600; color: #A9CBD4\">Pytanie 2 z 5<\/div>\n      <h1 style=\"margin: 0; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -0.3px\">Fakt czy opinia?<\/h1>\n    <\/header>\n\n    <div role=\"img\" aria-label=\"Postęp quizu: pytanie 2 z 5\" style=\"display: flex; align-items: center; gap: 6px\">\n      <span style=\"flex: none; width: 18px; height: 18px; border-radius: 999px; background: #5EE6D6; display: flex; align-items: center; justify-content: center\">\n        <svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#04202B\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg>\n      <\/span>\n      <span style=\"flex: 1; height: 2px; background: #5EE6D6\"><\/span>\n      <span style=\"flex: none; width: 18px; height: 18px; border-radius: 999px; background: #5EE6D6; display: flex; align-items: center; justify-content: center\">\n        <svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#04202B\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg>\n      <\/span>\n      <span style=\"flex: 1; height: 2px; background: rgba(255,255,255,0.25)\"><\/span>\n      <span style=\"flex: none; box-sizing: border-box; width: 18px; height: 18px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.4)\"><\/span>\n      <span style=\"flex: 1; height: 2px; background: rgba(255,255,255,0.25)\"><\/span>\n      <span style=\"flex: none; box-sizing: border-box; width: 18px; height: 18px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.4)\"><\/span>\n      <span style=\"flex: 1; height: 2px; background: rgba(255,255,255,0.25)\"><\/span>\n      <span style=\"flex: none; box-sizing: border-box; width: 18px; height: 18px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.4)\"><\/span>\n    <\/div>\n\n    <section aria-label=\"Pytanie\" style=\"box-sizing: border-box; padding: 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); border-radius: 20px\">\n      <div style=\"font-size: 12px; line-height: 16px; font-weight: 700; color: #A9CBD4; letter-spacing: 0.4px; text-transform: uppercase\">Zdanie z wpisu w mediach społecznościowych<\/div>\n      <p style=\"margin: 10px 0 0; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 20px; line-height: 32px; font-weight: 700\">„Ta ustawa to <span style=\"padding: 2px 4px; border-radius: 6px; background: rgba(242,201,76,0.32); border-bottom: 2px dashed #F2C94C\">najgorsza decyzja<\/span> Sejmu od lat.”<\/p>\n    <\/section>\n\n    <div role=\"group\" aria-label=\"Odpowiedzi\" style=\"display: flex; flex-direction: column; gap: 8px\">\n      <div style=\"box-sizing: border-box; min-height: 52px; padding: 8px 14px; display: flex; align-items: center; gap: 12px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); color: #B9D6DE\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A9CBD4\" stroke-width=\"2\" aria-hidden=\"true\" style=\"flex: none\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><\/svg>\n        <span style=\"font-size: 16px; line-height: 22px; font-weight: 700\">Fakt<\/span>\n      <\/div>\n      <div style=\"box-sizing: border-box; min-height: 52px; padding: 8px 14px; display: flex; align-items: center; gap: 12px; -size: 12px; line-height: 16px; font-weight: 700; color: #A9CBD4\">{{ pC }}<\/div>\n        <\/div>\n        <div style=\"text-align: right\">\n          <div style=\"font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 22px; line-height: 28px; font-weight: 800; color: #CBB0FF\">{{ nR }}<\/div>\n          <div style=\"font-size: 12px; line-height: 16px; font-weight: 700; color: #A9CBD4\">{{ pR }}<\/div>\n        <\/div>\n      <\/div>\n      <div style=\"margin-top: 8px; font-size: 12px; line-height: 17px; font-weight: 500; color: #A9CBD4\">Podział według deklarowanego profilu redakcji. Przykładowe dane i fikcyjne media.<\/div>\n    <\/section>\n\n    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n      <h3 style=\"margin: 0; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 16px; line-height: 22px; font-weight: 700\">Lista redakcji<\/h3>\n      <button type=\"button\" onClick=\"{{ toggleSort }}\" style=\"height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); color: #E8F6F8; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; cursor: pointer\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4\"><\/path><\/svg>\n        {{ sortLabel }}\n      <\/button>\n    <\/div>\n\n    <div role=\"list\" aria-label=\"Lista redakcji\" style=\"flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 28px\">\n      <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"9\">\n        <a role=\"listitem\" href=\"Article.dc.html\" onclick=\"{{ r.open }}\" style=\"flex: none; box-sizing: border-box; min-height: 64px; padding: 10px oke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h7a1 1 0 0 1 1 1v14a1 1 0 0 0-1-1H4zM20 5h-7a1 1 0 0 0-1 1v14a1 1 0 0 1 1-1h7z\"><\/path><\/svg>\n      Nauka\n    <\/a>\n  <\/nav>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    const st = this.state || {};\n    const desc = !!st.desc;\n    const ev = curEvent();\n    const leans = NEWS_LEANS;\n    const data = ev.articles.map((a) => [a.name, a.lean, a.pct, a.id]);\n    const sorted = data.slice().sort((a, b) => desc ? b[2] - a[2] : a[2] - b[2]);\n    const rows = sorted.map((d) => {\n      const lean = leans[d[1]];\n      const p = d[2];\n      return {\n        name: d[0],\n        lean: lean.label,\n        leanColor: lean.color,\n        pct: p + '%',\n        barColor: newsBar(p),\n        open: () => select({ src: d[3], from: 'Sources' }),\n      };\n    });\n    const zone = { L: [0.06, 0.28], C: [0.36, 0.64], R: [0.72, 0.94] };\n    const cnt = { L: 0, C: 0, R: 0 };\n    data.forEach((d) => { cnt[d[1]] += 1; });\n    const pos = [];\n    ['L', 'C', 'R'].forEach((k) => { const z = zone[k], n = cnt[k]; for (let i = 0; i < n; i++) pos.push([k, n === 1 ? (z[0] + z[1]) / 2 : z[0] + (z[1] - z[0]) * i / (n - 1)]); });\n    const total = data.length;\n    const pct = (n) => Math.round(n * 100 / total) + '%';\n    const pl = (k) => (k === 1 ? 'źródło' : (k % 10 >= 2 && k % 10 <= 4 && (k % 100 < 12 || k % 100 > 14)) ? 'źródła' : 'źródeł');\n    const dots = pos.map((p, i) => ({\n      left: 'calc(' + (p[1] * 100) + '% - 8px)',\n      top: (i % 2 === 0 ? 14 : 22) + 'px',\n      color: leans[p[0]].color,\n    }));\n    return {\n      rows: rows,\n      title: ev.title,\n      countLabel: total + ' ' + pl(total),\n      axisLabel: 'Rozkład źródeł: lewica ' + cnt.L + ', centrum ' + cnt.C + ', prawica ' + cnt.R,\n      nL: cnt.L, nC: cnt.C, nR: cnt.R,\n      pL: 'Lewica · ' + pct(cnt.L), pC: 'Centrum · ' + pct(cnt.C), pR: 'Prawica · ' + pct(cnt.R),\n      dots: dots,\n      sortLabel: desc ? 'Od najbardziej emocjonalnych' : 'Od najmniej emocjonalnych',\n      toggleSort: () => {\n        const cur = !!(this.state && this.state.desc);\n        this.setState({ desc: !cur });\n      },\n    };\n  }\n}"}, "Achievements": {"html": "<div style=\"position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(180deg, #0E4263 0%, #0A2A43 14%, #06182A 40%, #04111D 70%, #04111D 100%); color: #E8F6F8; font-family: 'Manrope', system-ui, sans-serif\">\n\n  <svg width=\"390\" height=\"844\" viewBox=\"0 0 390 844\" aria-hidden=\"true\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\">\n    <defs>\n      <linearGradient id=\"rays-ach\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#9FF3EA\" stop-opacity=\"0.15\"/>\n        <stop offset=\"1\" stop-color=\"#9FF3EA\" stop-opacity=\"0\"/>\n      <\/linearGradient>\n    <\/defs>\n    <polygon points=\"230,0 310,0 390,420 270,420\" fill=\"url(#rays-ach)\"/>\n    <circle cx=\"364\" cy=\"120\" r=\"14\" fill=\"rgba(94,230,214,0.05)\" stroke=\"#5EE6D6\" stroke-opacity=\"0.3\" stroke-width=\"1.5\"/>\n    <circle cx=\"20\" cy=\"560\" r=\"12\" fill=\"none\" stroke=\"#5EE6D6\" stroke-opacity=\"0.22\" stroke-width=\"1.5\"/>\n    <circle cx=\"370\" cy=\"700\" r=\"20\" fill=\"none\" stroke=\"#5EE6D6\" stroke-opacity=\"0.18\" stroke-width=\"1.5\"/>\n  <\/svg>\n\n  <div style=\"position: relative; flex: 1; min-height: 0; box-sizing: border-box; padding: 28px 24px 0; display: flex; flex-direction: column; gap: 14px\">\n\n    <header style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n      <a href=\"Learn.dc.html\" aria-label=\"Wróć do nauki\" style=\"flex: none; width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); color: #E8F6F8; display: flex; align-items -opacity=\"0\"/>\n      <\/linearGradient>\n    <\/defs>\n    <polygon points=\"210,0 290,0 380,400 260,400\" fill=\"url(#rays-comp)\"/>\n    <circle cx=\"30\" cy=\"132\" r=\"12\" fill=\"none\" stroke=\"#5EE6D6\" stroke-opacity=\"0.26\" stroke-width=\"1.5\"/>\n    <circle cx=\"366\" cy=\"600\" r=\"20\" fill=\"rgba(94,230,214,0.04)\" stroke=\"#5EE6D6\" stroke-opacity=\"0.2\" stroke-width=\"1.5\"/>\n  <\/svg>\n\n  <div style=\"position: relative; flex: 1; min-height: 0; box-sizing: border-box; padding: 28px 24px 0; display: flex; flex-direction: column; gap: 14px\">\n\n    <header style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n      <a href=\"Learn.dc.html\" aria-label=\"Wróć do nauki\" style=\"flex: none; width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); color: #E8F6F8; display: flex; align-items: center; justify-content: center; text-decoration: none\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"/><\/svg>\n      <\/a>\n      <h1 style=\"margin: 0; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 18px; line-height: 24px; font-weight: 700\">Kompendium wiedzy<\/h1>\n      <span style=\"flex: none; width: 44px; height: 44px\"><\/span>\n    <\/header>\n\n    <div style=\"flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain\">\n\n      <section aria-label=\"Szybki test\" style=\"flex: none; box-sizing: border-box; padding: 16px; border-radius: 20px; background: linear-gradient(135deg, rgba(94,230,214,0.18), rgba(127,182,255,0.14)); border: 1px solid rgba(94,230,214,0.5); display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"font-size: 12px; line-height: 16px; font-weight: 800; letter-spacing: 0.6px; color: #7FF0E0\">ŚCIĄGAWKA<\/div>\n        <h2 style=\"margin: 0; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 17px; line-height: 24px; font-weight: 700\">Szybki test w 3 pytaniach<\/h2>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 19px; color: #CFE6EC\">\n          <div style=\"display: flex; gap: 10px; align-items: flex-start\"><span style=\"flex: none; min-width: 66px; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: rgba(94,230,214,0.2); color: #7FF0E0; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">FAKT<\/span><span>Czy da się to sprawdzić w danych, dokumentach lub nagraniach?<\/span><\/div>\n          <div style=\"display: flex; gap: 10px; align-items: flex-start\"><span style=\"flex: none; min-width: 66px; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: rgba(242,201,76,0.18); color: #F5D874; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">OPINIA<\/span><span>Czy to czyjaś ocena, przekonanie lub przewidywanie?<\/span><\/div>\n          <div style=\"display: flex; gap: 10px; align-items: flex-start\"><span style=\"flex: none; min-width: 66px; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: rgba(255,122,102,0.18); color: #FFB0A4; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">UWAGA<\/span><span>Czy tekst gra na emocjach zamiast podawać źródła?<\/span><\/div>\n        <\/div>\n      <\/section>\n\n      <h2 style=\"flex: none; margin: 4px 0 0; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 16px; line-height: 24px; font-weight: 700\">Materiały do nauki<\/h2>\n\n      <sc-for list=\"{{ topics }}\" as=\"t\" hint-placeholder-count=\"7\">\n        <article style=\"flex: none; box-sizing: border-box; background: {{ t.bg }}; border: 1px solid {{ t.border }}; border-radius: 20px; overflow: hidden\">\n          <button type=\"button\" onclick=\"{{ t.toggle }}\" aria-expanded=\"{{ t.expanded }}\" style=\"width: 100%; min-height: 64px; box-sizing: border-box; padding: 12px 14px; border: 0; background: transparent; color: #E8F6F8; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer\">\n            <span style=\"flex: none; width: 40px; height: 40px; border-radius: 12px; background: {{ t.iconBg }}; color: {{ t.color }}; display: flex; align-items: center; justify-content: center; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 16px; font-weight: 800\">{{ t.num }}<\/span>\n            <span style=\"flex: 1; min-width: 0\">\n              <span style=\"display: block; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700\">{{ t.title }}<\/span>\n              <span style=\"display: block; margin-top: 2px; font-size: 12px; line-height: 17px; font-weight: 600; color: #A9CBD4\">{{ t.sub }}<\/span>\n            <\/span>\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A9CBD4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; transform: rotate({{ t.rot }}deg); transition: transform .2s ease\"><path d=\"M6 9l6 6 6-6\"/><\/svg>\n          <\/button>\n          <sc-if value=\"{{ t.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"box-sizing: border-box; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; animation: pop .25s ease both\">\n              <p style=\"margin: 0; font-size: 14px; line-height: 21px; color: #CFE6EC\">{{ t.intro }}<\/p>\n              <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px\">\n                <sc-for list=\"{{ t.points }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <li style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 19px; color: #B9D6DE\"><span style=\"flex: none; margin-top: 6px; width: 7px; height: 7px; border-radius: 999px; background: {{ t.color }}\"><\/span><span><b style=\"color: #E8F6F8\">{{ p.h }}<\/b> {{ p.d }}<\/span><\/li>\n                <\/sc-for>\n              <\/ul>\n              <sc-for list=\"{{ t.examples }}\" as=\"x\" hint-placeholder-count=\"2\">\n                <div style=\"flex: none; box-sizing: border-box; padding: 10px 12px; border-radius: 14px; background: rgba(4,17,29,0.55); border: 1px solid rgba(255,255,255,0.12)\">\n                  <div style=\"font-size: 14px; line-height: 20px; font-weight: 700; color: #E8F6F8\">{{ x.q }}<\/div>\n                  <div style=\"margin-top: 6px; display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 17px; color: #A9CBD4\"><span style=\"flex: none; height: 20px; padding: 0 8px; border-radius: 999px; background: {{ x.tagBg }}; color: {{ x.tagColor }}; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center\">{{ x.tag }}<\/span><span>{{ x.why }}<\/span><\/div>\n                <\/div>\n              <\/sc-for>\n              <sc-if value=\"{{ t.hasTip }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display: flex; gap: 8px; align-items: flex-start; box-sizing: border-box; padding: 10px 12px; border-radius: 14px; background: rgba(94,230,214,0.1); border: 1px dashed rgba(94,230,214,0.5); font-size: 13px; line-height: 19px; color: #CFE6EC\">\n                  <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5EE6D6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 2px\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z\"/><\/svg>\n                  <span>{{ t.tip }}<\/span>\n                <\/div>\n              <\/sc-if>\n            <\/div>\n          <\/sc-if>\n        <\/article>\n      <\/sc-for>\n\n      <a href=\"Quiz.dc.html\" onclick=\"{{ startQuiz }}\" style=\"margin-top: 4px; width: 100%; height: 52px; box-sizing: border-box; border-radius: 16px; background: #5EE6D6; color: #04202B; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; text-decoration: none; flex: none\">\n        Sprawdź się w quizie\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg>\n      <\/a>\n\n    <\/div>\n\n  <\/div>\n\n  <div aria-hidden=\"true\" style=\"position: absolute; left: 0; right: 0; bottom: 84px; height: 36px; pointer-events: none; background: linear-gradient(180deg, rgba(4,17,29,0), #04111D)\"><\/div>\n\n  <nav aria-label=\"Nawigacja\" style=\"position: relative; box-sizing: border-box; height: 84px; padding: 8px 12px 20px; background: rgba(4,17,29,0.92); border-top: 1px solid rgba(255,255,255,0.12); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))\">\n    <a href=\"Main.dc.html\" style=\"min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9CBD4; font-size: 12px; line-height: 16px; font-weight: 700; text-decoration: none\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"14\" r=\"6\"/><circle cx=\"18\" cy=\"6\" r=\"2.5\"/><\/svg>\n      Start\n    <\/a>\n    <a href=\"Compare.dc.html\" style=\"min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9CBD4; font-size: 12px; line-height: 16px; font-weight: 700; text-decoration: none\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"12\" r=\"6\"/><circle cx=\"15\" cy=\"12\" r=\"6\"/><\/svg>\n      Porównaj\n    <\/a>\n    <a href=\"Article.dc.html\" style=\"min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9CBD4; font-size: 12px; line-height: 16px; font-weight: 700; text-decoration: none\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"M16 16l5 5\"/><\/svg>\n      Analiza\n    <\/a>\n    <a href=\"Learn.dc.html\" aria-current=\"page\" style=\"min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5EE6D6; font-size: 12px; line-height: 16px; font-weight: 800; text-decoration: none\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h7a1 1 0 0 1 1 1v14a1 1 0 0 0-1-1H4zM20 5h-7a1 1 0 0 0-1 1v14a1 1 0 0 1 1-1h7z\"/><\/svg>\n      Nauka\n    <\/a>\n  <\/nav>\n<\/div>\n", "js": "class Component extends DCLogic {\n  renderVals() {\n    const TAGS = {\n      fakt: ['FAKT', 'rgba(94,230,214,0.2)', '#7FF0E0'],\n      opinia: ['OPINIA', 'rgba(242,201,76,0.18)', '#F5D874'],\n      mix: ['MIESZANKA', 'rgba(127,182,255,0.2)', '#A9CCFF'],\n      fake: ['FAŁSZ', 'rgba(255,122,102,0.18)', '#FFB0A4'],\n    };\n    const ex = (q, tag, why) => ({ q: q, tag: TAGS[tag][0], tagBg: TAGS[tag][1], tagColor: TAGS[tag][2], why: why });\n    const TOPICS = [\n      {\n        title: 'Fakt a opinia', sub: 'Podstawowa różnica, od której wszystko się zaczyna', color: '#5EE6D6',\n        intro: 'Fakt to twierdzenie, które można sprawdzić niezależnie od tego, kto je wypowiada. Opinia to ocena, przekonanie lub interpretacja — nie jest ani prawdziwa, ani fałszywa, może być tylko lepiej lub gorzej uzasadniona.',\n        points: [\n          { h: 'Fakt:', d: 'liczby, daty, nazwiska, wyniki głosowań, cytaty, zdarzenia, które da się potwierdzić w dokumentach, danych lub nagraniach.' },\n          { h: 'Opinia:', d: 'oceny („dobry”, „fatalny”, „skandaliczny”), przekonania („uważam”, „moim zdaniem”), postulaty („rząd powinien”) i przewidywania („to doprowadzi do…”).' },\n          { h: 'Złoty test:', d: 'czy da się to rozstrzygnąć bez pytania autora o zdanie? Jeśli tak — to twierdzenie o fakcie.' },\n        ],\n        examples: [\n          ex('„Inflacja w październiku wyniosła 4,9% — podał GUS.”', 'fakt', 'Konkretna liczba ze wskazanym, publicznym źródłem.'),\n          ex('„To najbardziej nieudolny rząd w historii.”', 'opinia', '„Najbardziej nieudolny” to ocena — nie ma miary, którą można by to sprawdzić.'),\n        ],\n        tip: 'Opinie nie są czymś złym! Problem zaczyna się wtedy, gdy opinia udaje fakt albo gdy fakty są dobierane tylko pod tezę.',\n      },\n      {\n        title: 'Zdania-mieszanki', sub: 'Gdy fakt i opinia są w jednym zdaniu', color: '#7FB6FF',\n        intro: 'Media i politycy często łączą sprawdzalną informację z oceną. Naucz się rozdzielać je na dwie części i oceniać każdą osobno.',\n        points: [\n          { h: 'Rozbij zdanie:', d: 'oddziel to, co się wydarzyło, od tego, co autor o tym myśli.' },\n          { h: 'Fakt ≠ prawda:', d: 'zdanie o faktach też może być fałszywe. „W Polsce mieszka 80 mln osób” to twierdzenie o fakcie — tylko nieprawdziwe.' },\n          { h: 'Uważaj na pominięcia:', d: 'prawdziwe liczby bez kontekstu (np. bez porównania z poprzednim rokiem) też potrafią wprowadzić w błąd.' },\n        ],\n        examples: [\n          ex('„Rząd podniósł akcyzę o 10%, co jest kolejnym ciosem w portfele Polaków.”', 'mix', 'Podwyżka o 10% to fakt do sprawdzenia. „Cios w portfele” to już ocena autora.'),\n        ],\n        tip: 'Pytaj: co tu jest informacją, a co komentarzem? Komentarz możesz przyjąć lub odrzucić — informację warto sprawdzić.',\n      },\n      {\n        title: 'Czym jest fake news?', sub: 'Rodzaje fałszywych i zmanipulowanych treści', color: '#FF7A66',\n        intro: 'Fake news to fałszywa lub zmanipulowana informacja podana tak, by wyglądała na prawdziwą wiadomość. Dezinformacja jest rozpowszechniana celowo, a misinformacja — nieświadomie, np. przez znajomych, którzy w nią uwierzyli.',\n        points: [\n          { h: 'Treść zmyślona:', d: 'wydarzenie, cytat lub badanie, które nigdy nie istniało.' },\n          { h: 'Fałszywy kontekst:', d: 'prawdziwe zdjęcie lub nagranie, ale z innego miejsca albo sprzed lat.' },\n          { h: 'Podszywanie się:', d: 'strona lub profil udający znane medium, instytucję czy osobę publiczną.' },\n          { h: 'Manipulacja materiałem:', d: 'przerobione zdjęcia, wycięte fragmenty wypowiedzi, deepfake’i.' },\n          { h: 'Satyra wzięta na serio:', d: 'żart z portalu satyrycznego udostępniany jako prawdziwa wiadomość.' },\n        ],\n        examples: [\n          ex('Zdjęcie powodzi sprzed 8 lat opisane jako „wczorajsza tragedia”.', 'fake', 'Zdjęcie jest prawdziwe, ale kontekst został sfałszowany.'),\n        ],\n        tip: '',\n      },\n      {\n        title: 'Czerwone flagi', sub: 'Sygnały, że coś może być nie tak', color: '#F2C94C',\n        intro: 'Żaden z tych sygnałów sam w sobie nie przesądza, że informacja jest fałszywa — ale każdy powinien skłonić Cię do sprawdzenia.',\n        points: [\n          { h: 'Krzykliwy tytuł:', d: 'WIELKIE LITERY, wykrzykniki, słowa „szok”, „skandal”, „musisz to zobaczyć”.' },\n          { h: 'Brak źródeł:', d: 'brak autora, daty lub linków; „anonimowe źródła”, „naukowcy twierdzą” bez nazwisk.' },\n          { h: 'Presja:', d: '„Udostępnij, zanim usuną!”, „media o tym milczą”.' },\n          { h: 'Dziwny adres:', d: 'domena podobna do znanego portalu, ale z dziwną końcówką lub literówką.' },\n          { h: 'Silne emocje:', d: 'tekst wywołuje złość lub strach i potwierdza dokładnie to, co już myślisz.' },\n          { h: 'Zbyt piękne:', d: 'cudowne leki, „rząd rozdaje pieniądze”, sensacje, o których nikt inny nie pisze.' },\n        ],\n        examples: [],\n        tip: 'Im mocniej wiadomość Cię porusza, tym dłużej warto się nad nią zatrzymać.',\n      },\n      {\n        title: 'Jak sprawdzić informację?', sub: '6 kroków weryfikacji', color: '#5EE6D6',\n        intro: 'Weryfikacja nie musi trwać długo. Zwykle wystarczy kilka minut, by odsiać większość fałszywek.',\n        points: [\n          { h: '1. Zatrzymaj się.', d: 'Nie udostępniaj od razu. Zauważ, jakie emocje budzi w Tobie tekst.' },\n          { h: '2. Sprawdź źródło.', d: 'Kto to opublikował? Zajrzyj do zakładki „O nas”, sprawdź adres strony i autora.' },\n          { h: '3. Czytaj „w bok”.', d: 'Otwórz nową kartę i poszukaj tej informacji w innych, niezależnych mediach.' },\n          { h: '4. Dotrzyj do oryginału.', d: 'Znajdź pełny cytat, dokument, raport lub badanie, na które powołuje się tekst.' },\n          { h: '5. Sprawdź datę.', d: 'Stare wiadomości często wracają jako „nowe”.' },\n          { h: '6. Sprawdź zdjęcia.', d: 'Użyj wyszukiwania obrazem, by zobaczyć, gdzie i kiedy zdjęcie pojawiło się po raz pierwszy.' },\n        ],\n        examples: [],\n        tip: 'Jeśli żadne poważne medium nie podaje tej informacji, a jest ona sensacyjna — to bardzo zły znak.',\n      },\n      {\n        title: 'Pułapki naszego umysłu', sub: 'Dlaczego dajemy się nabrać', color: '#7FB6FF',\n        intro: 'Fake newsy działają, bo wykorzystują naturalne skróty myślowe. Świadomość tych mechanizmów to pierwszy krok, by wyjść z bańki.',\n        points: [\n          { h: 'Bańka informacyjna:', d: 'algorytmy podsuwają treści podobne do tych, które już lubisz — widzisz coraz węższy obraz świata.' },\n          { h: 'Efekt potwierdzenia:', d: 'łatwiej wierzymy w to, co zgadza się z naszymi poglądami.' },\n          { h: 'Efekt iluzji prawdy:', d: 'informacja powtarzana wiele razy wydaje się bardziej prawdziwa.' },\n          { h: 'Społeczny dowód słuszności:', d: 'skoro tyle osób to udostępnia, musi być prawdą — niestety nie.' },\n        ],\n        examples: [],\n        tip: 'Porównuj, jak to samo wydarzenie opisują media o różnych poglądach — to najlepszy sposób na wyjście z bańki.',\n      },\n      {\n        title: 'Przydatne narzędzia', sub: 'Gdzie szukać pomocy w weryfikacji', color: '#F2C94C',\n        intro: 'Nie musisz sprawdzać wszystkiego sam. Istnieją serwisy i narzędzia, które zajmują się tym zawodowo.',\n        points: [\n          { h: 'Serwisy fact-checkingowe:', d: 'Demagog, Konkret24, AFP Sprawdzam, FakeHunter — sprawdzają popularne wypowiedzi i viralowe treści.' },\n          { h: 'Wyszukiwanie obrazem:', d: 'Google Lens lub TinEye pokażą, gdzie wcześniej pojawiło się dane zdjęcie.' },\n          { h: 'Archiwa internetu:', d: 'Wayback Machine pozwala zobaczyć, jak strona wyglądała w przeszłości.' },\n          { h: 'Dane źródłowe:', d: 'GUS, Eurostat, strony Sejmu i ministerstw — tam znajdziesz oryginalne liczby i dokumenty.' },\n          { h: 'Ta aplikacja:', d: 'zakładki „Porównaj” i „Analiza” pokażą, jak różne źródła opisują to samo wydarzenie.' },\n        ],\n        examples: [],\n        tip: '',\n      },\n    ];\n    const st = this.state || {};\n    const open = st.open === undefined ? -1 : st.open;\n    const topics = TOPICS.map((t, i) => {\n      const isOpen = open === i;\n      return {\n        num: String(i + 1),\n        title: t.title,\n        sub: t.sub,\n        color: t.color,\n        iconBg: 'rgba(255,255,255,0.08)',\n        bg: isOpen ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.07)',\n        border: isOpen ? t.color : 'rgba(255,255,255,0.16)',\n        open: isOpen,\n        expanded: isOpen ? 'true' : 'false',\n        rot: isOpen ? 180 : 0,\n        intro: t.intro,\n        points: t.points,\n        examples: t.examples,\n        hasTip: !!t.tip,\n        tip: t.tip,\n        toggle: () => { const s = this.state || {}; const cur = s.open === undefined ? -1 : s.open; this.setState({ open: cur === i ? -1 : i }); },\n      };\n    });\n    return {\n      topics: topics,\n      startQuiz: () => {\n        try { if (typeof inst !== 'undefined' && inst.Quiz) { inst.Quiz.state = {}; } } catch (e) {}\n      },\n    };\n  }\n}\n"}, "Settings": {"html": "<div style=\"position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(180deg, #0E4263 0%, #0A2A43 18%, #06182A 50%, #04111D 100%); color: #E8F6F8; font-family: 'Manrope', system-ui, sans-serif\">\n\n  <svg width=\"390\" height=\"844\" viewBox=\"0 0 390 844\" aria-hidden=\"true\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\">\n    <defs>\n      <linearGradient id=\"rays-set\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0\" stop-color=\"#9FF3EA\" stop-opacity=\"0.14\"><\/stop>\n        <stop offset=\"1\" stop-color=\"#9FF3EA\" stop-opacity=\"0\"><\/stop>\n      <\/linearGradient>\n    <\/defs>\n    <polygon points=\"250,0 320,0 390,360 270,360\" fill=\"url(#rays-set)\"><\/polygon>\n    <circle cx=\"34\" cy=\"140\" r=\"12\" fill=\"rgba(94,230,214,0.05)\" stroke=\"#5EE6D6\" stroke-opacity=\"0.3\" stroke-width=\"1.5\"><\/circle>\n    <circle cx=\"356\" cy=\"720\" r=\"22\" fill=\"none\" stroke=\"#5EE6D6\" stroke-opacity=\"0.2\" stroke-width=\"1.5\"><\/circle>\n  <\/svg>\n\n  <div style=\"position: relative; flex: 1; min-height: 0; box-sizing: border-box; padding: 28px 24px 0; display: flex; flex-direction: column; gap: 14px\">\n\n    <header style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n      <a href=\"Main.dc.html\" aria-label=\"Wróć do startu\" style=\"flex: none; width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); color: #E8F6F8; display: flex; align-items: center; justify-content: center; text-decoration: none\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg>\n      <\/a>\n      <h1 style=\"margin: 0; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 18px; line-height: 24px; font-weight: 700\">Ustawienia<\/h1>\n      <span style=\"flex: none; width: 44px; height: 44px\"><\/span>\n    <\/header>\n\n    <div style=\"flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 40px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain\">\n\n      <h2 style=\"flex: none; margin: 4px 0 0; font-size: 12px; line-height: 16px; font-weight: 800; letter-spacing: 0.6px; color: #7FF0E0\">APLIKACJA<\/h2>\n\n      <section aria-label=\"Preferencje aplikacji\" style=\"flex: none; box-sizing: border-box; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); border-radius: 20px; overflow: hidden\">\n        <sc-for list=\"{{ toggles }}\" as=\"o\" hint-placeholder-count=\"3\">\n          <button type=\"button\" role=\"switch\" aria-checked=\"{{ o.checked }}\" onclick=\"{{ o.toggle }}\" style=\"width: 100%; min-height: 72px; box-sizing: border-box; padding: 14px 16px; border: 0; border-top: {{ o.divider }}; background: transparent; color: #E8F6F8; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer\">\n            <span style=\"flex: none; width: 40px; height: 40px; border-radius: 12px; background: rgba(94,230,214,0.14); color: #5EE6D6; display: flex; align-items: center; justify-content: center\">\n              <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ o.icon }}\"><\/path><\/svg>\n            <\/span>\n            <span style=\"flex: 1; min-width: 0\">\n              <span style=\"display: block; font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700\">{{ o.label }}<\/span>\n              <span style=\"display: block; margin-top: 2px; font-size: 12px; line-height: 17px; font-weight: 600; color: #A9CBD4\">{{ o.desc }}<\/span>\n            <\/span>\n            <span aria-hidden=\"true\" style=\"flex: none; position: relative; width: 48px; height: 28px; box-sizing: border-box; border-radius: 999px; background: {{ o.trackBg }}; border: 1px solid {{ o.trackBorder }}; transition: background .2s ease\">\n              <span style=\"position: absolute; top: 3px; left: {{ o.knobLeft }}; width: 20px; height: 20px; border-radius: 999px; background: {{ o.knobBg }}; transition: left .2s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.35)\"><\/span>\n            <\/span>\n          <\/button>\n        <\/sc-for>\n      <\/section>\n\n      <h2 style=\"flex: none; margin: 6px 0 0; font-size: 12px; line-height: 16px; font-weight: 800; letter-spacing: 0.6px; color: #7FF0E0\">DANE<\/h2>\n\n      <section aria-label=\"Dane\" style=\"flex: none; box-sizing: border-box; padding: 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); border-radius: 20px; display: flex; flex-direction: column; gap: 12px\">\n        <div>\n          <div style=\"font-family: 'Sora', 'Manrope', system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700\">Przywróć domyślne<\/div>\n          <div style=\"margin-top: 2px; font-size: 12px; line-height: 17px; font-weight: 600; color: #A9CBD4\">Ustawienia są zapisywane tylko na tym urządzeniu.<\/div>\n        <\/div>\n        <button type=\"button\" onclick=\"{{ reset }}\" style=\"min-height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid {{ resetBorder }}; background: {{ resetBg }}; color: {{ resetColor }}; font-size: 14px; line-height: 20px; font-weight: 800; cursor: pointer\">{{ resetLabel }}<\/button>\n        <sc-if value=\"{{ resetDone }}\" hint-placeholder-val=\"{{ false }}\">\n          <div role=\"status\" style=\"font-size: 12px; line-height: 17px; font-weight: 700; color: #7FF0E0\">Przywrócono ustawienia domyślne.<\/div>\n        <\/sc-if>\n      <\/section>\n\n      <h2 style=\"flex: none; margin: 6px 0 0; font-size: 12px; line-height: 16px; font-weight: 800; letter-spacing: 0.6px; color: #7FF0E0\">O APLIKACJI<\/h2>\n\n      <section aria-label=\"O aplikacji\" style=\"flex: none; box-sizing: border-box; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); border-radius: 20px; overflow: hidden\">\n        <a href=\"Compendium.dc.html\" style=\"min-height: 56px; box-sizing: border-box; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #E8F6F8; text-decoration: none\">\n          <span style=\"font-size: 14px; line-height: 20px; font-weight: 700\">Kompendium wiedzy<\/span>\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A9CBD4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg>\n        <\/a>\n        <a href=\"Achievements.dc.html\" style=\"min-height: 56px; box-sizing: border-box; padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #E8F6F8; text-decoration: none\">\n          <span style=\"font-size: 14px; line-height: 20px; font-weight: 700\">Osiągnięcia<\/span>\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A9CBD4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg>\n        <\/a>\n        <div style=\"min-height: 56px; box-sizing: border-box; padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n          <span style=\"font-size: 14px; line-height: 20px; font-weight: 700\">Wersja<\/span>\n          <span style=\"font-size: 13px; line-height: 18px; font-weight: 700; color: #A9CBD4\">1.0<\/span>\n        <\/div>\n      <\/section>\n\n      <p style=\"flex: none; margin: 4px 0 0; font-size: 12px; line-height: 18px; font-weight: 600; color: #8FB3BE; text-align: center\">Wyjdź z bańki — ucz się odróżniać fakty od opinii.<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n", "js": "class Component extends DCLogic {\n  renderVals() {\n    const st = this.state || {};\n    const ICONS = {\n      motion: 'M3 12c2.5-4 5.5-4 8 0s5.5 4 8 0M3 18c2.5-4 5.5-4 8 0s5.5 4 8 0M3 6c2.5-4 5.5-4 8 0s5.5 4 8 0',\n      haptics: 'M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM3 9v6M21 9v6',\n      splash: 'M12 3v4M12 17v4M4.5 12H3M21 12h-1.5M6 6l1.5 1.5M16.5 16.5L18 18M6 18l1.5-1.5M16.5 7.5L18 6M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',\n    };\n    const OPTS = [\n      ['motion', 'Animacje', 'Płynne przejścia, bąbelki i efekt zanurzenia'],\n      ['haptics', 'Wibracje', 'Delikatna wibracja przy zanurzeniu (jeśli telefon ją obsługuje)'],\n      ['splash', 'Ekran powitalny', 'Pokazuj ekran „Zanurz się” przy uruchomieniu'],\n    ];\n    const toggles = OPTS.map((o, i) => {\n      const on = !!PREFS[o[0]];\n      return {\n        label: o[1],\n        desc: o[2],\n        icon: ICONS[o[0]],\n        checked: on ? 'true' : 'false',\n        divider: i === 0 ? '0' : '1px solid rgba(255,255,255,0.1)',\n        trackBg: on ? '#5EE6D6' : 'rgba(255,255,255,0.12)',\n        trackBorder: on ? '#5EE6D6' : 'rgba(255,255,255,0.22)',\n        knobLeft: on ? '23px' : '3px',\n        knobBg: on ? '#04111D' : '#CFE6EC',\n        toggle: () => { setPref(o[0], !PREFS[o[0]]); this.setState({ confirm: false, done: false }); },\n      };\n    });\n    const confirm = !!st.confirm;\n    return {\n      toggles: toggles,\n      resetLabel: confirm ? 'Na pewno? Kliknij ponownie' : 'Przywróć ustawienia domyślne',\n      resetBg: confirm ? 'rgba(255,122,102,0.18)' : 'rgba(255,255,255,0.07)',\n      resetBorder: confirm ? 'rgba(255,122,102,0.6)' : 'rgba(255,255,255,0.22)',\n      resetColor: confirm ? '#FFB0A4' : '#E8F6F8',\n      resetDone: !!st.done,\n      reset: () => {\n        const s = this.state || {};\n        if (s.confirm) { resetPrefs(); this.setState({ confirm: false, done: true }); }\n        else this.setState({ confirm: true, done: false });\n      },\n    };\n  }\n}\n"}};
const stage=document.getElementById('stage');
const tpl={},inst={};
function lookup(scope,expr){expr=expr.trim();if(expr==='true')return true;if(expr==='false')return false;let v=scope;for(const k of expr.split('.')){if(v==null)return undefined;v=v[k]}return v}
function subst(str,scope){const whole=str.match(/^\s*\{\{([^}]*)\}\}\s*$/);if(whole)return lookup(scope,whole[1]);return str.replace(/\{\{([^}]*)\}\}/g,(_,e)=>{const v=lookup(scope,e);return v==null?'':String(v)})}
function build(node,scope,out){
  if(node.nodeType===3){out.appendChild(document.createTextNode(node.nodeValue.indexOf('{{')>=0?String(subst(node.nodeValue,scope)??''):node.nodeValue));return}
  if(node.nodeType!==1)return;
  const tag=node.localName;
  if(tag==='sc-for'){const list=lookup(scope,node.getAttribute('list').replace(/[{}]/g,''))||[];const as=node.getAttribute('as');list.forEach(item=>{const s=Object.create(scope);s[as]=item;node.childNodes.forEach(c=>build(c,s,out))});return}
  if(tag==='sc-if'){const v=lookup(scope,node.getAttribute('value').replace(/[{}]/g,''));if(v)node.childNodes.forEach(c=>build(c,scope,out));return}
  const el=document.createElementNS(node.namespaceURI,tag);
  for(const a of node.attributes){
    if(a.name.indexOf('hint-')===0)continue;
    if(/^on/.test(a.name)){const f=subst(a.value,scope);if(typeof f==='function')el.addEventListener(a.name.slice(2).toLowerCase(),f);continue}
    el.setAttribute(a.name,a.value.indexOf('{{')>=0?String(subst(a.value,scope)):a.value);
  }
  node.childNodes.forEach(c=>build(c,scope,el));
  out.appendChild(el);
}
let current=null;
function render(name){
  const root=stage;
  const scrolls=[...root.querySelectorAll('*')].map(e=>e.scrollTop);
  const vals=inst[name].renderVals()||{};
  const frag=document.createDocumentFragment();
  tpl[name].childNodes.forEach(c=>build(c,vals,frag));
  root.replaceChildren(frag);
  if(current===name){[...root.querySelectorAll('*')].forEach((e,i)=>{if(scrolls[i])e.scrollTop=scrolls[i]})}
}
function show(name){
  if(!SCREENS[name])name='Splash';
  if(!tpl[name]){const d=new DOMParser().parseFromString('<body>'+SCREENS[name].html+'</body>','text/html');tpl[name]=d.body;
    const C=new Function('DCLogic',SCREENS[name].js+';return Component;')(DCLogic);inst[name]=new C(()=>render(name))}
  const prev=stage.firstElementChild;const had=current!==null||stage.childElementCount>0;
  let ghost=null;
  if(prev&&motionOK()){ghost=prev.cloneNode(true);ghost.style.cssText+=';position:absolute;left:0;top:0;pointer-events:none;z-index:5';}
  current=null;render(name);current=name;document.title='Wyjdź z bańki';
  if(ghost&&had){stage.appendChild(ghost);ghost.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateX('+(-dir*28)+'px)'}],{duration:220,easing:'ease-in',fill:'forwards'}).onfinish=()=>ghost.remove();
    const root=stage.firstElementChild;const content=root&&root.children[1];
    if(content&&motionOK()){[...content.children].forEach((c,i)=>{c.animate([{opacity:0,transform:'translate('+(dir*24)+'px,10px)'},{opacity:1,transform:'none'}],{duration:340,delay:60+i*55,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'})})}}
  dir=1;
}
let dir=1;
function fit(){const s=Math.min(innerWidth/390,innerHeight/844,1.6);stage.style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',fit);fit();
document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const m=a.getAttribute('href').match(/^([A-Za-z]+)\.dc\.html$/);if(!m)return;e.preventDefault();dir=/^(Wróć|Zamknij)/.test(a.getAttribute('aria-label')||'')?-1:1;if(location.hash!=='#'+m[1])location.hash=m[1];else show(m[1])});
addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||(PREFS.splash?'Splash':'Main'));
</script>
<script>
/* "Zanurz się" — dive transition from Splash to Main */
(function(){
  let diving=false;
  const W=390,H=844;
  const ease={inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t};
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const seg=(t,a,b)=>clamp((t-a)/(b-a));
  document.addEventListener('click',e=>{
    if(diving||current!=='Splash')return;
    const a=e.target.closest('a[href="Main.dc.html"]');if(!a)return;
    if(!motionOK())return;
    e.preventDefault();e.stopImmediatePropagation();
    dive(a,e);
  },true);

  function dive(btn,ev){
    diving=true;
    try{PREFS.haptics&&navigator.vibrate&&navigator.vibrate([18,40,28])}catch(_){}
    const st=stage.getBoundingClientRect(),scale=st.width/W;
    const br=btn.getBoundingClientRect();
    const ox=((ev.clientX||br.left+br.width/2)-st.left)/scale, oy=((ev.clientY||br.top+br.height/2)-st.top)/scale;
    const cv=document.createElement('canvas');
    const dpr=Math.min((devicePixelRatio||1)*scale,3);
    cv.width=W*dpr;cv.height=H*dpr;
    cv.style.cssText='position:absolute;left:0;top:0;width:390px;height:844px;z-index:50;pointer-events:none';
    stage.appendChild(cv);
    const c=cv.getContext('2d');c.scale(dpr,dpr);

    btn.animate([{transform:'scale(1)',boxShadow:'0 0 0 0 rgba(94,230,214,.0)'},{transform:'scale(.92)',boxShadow:'0 0 0 6px rgba(94,230,214,.35)',offset:.25},{transform:'scale(1.05)',boxShadow:'0 0 40px 14px rgba(94,230,214,.55)',offset:.6},{transform:'scale(1)',boxShadow:'0 0 60px 30px rgba(94,230,214,0)'}],{duration:620,easing:'ease-out'});
    const screen=stage.firstElementChild;
    screen&&screen.animate([{transform:'none',filter:'none'},{transform:'translateY(-90px) scale(1.07)',filter:'blur(5px) brightness(.55) saturate(1.3)'}],{duration:1250,delay:120,easing:'cubic-bezier(.55,0,.3,1)',fill:'forwards'});

    const bubbles=[];
    function bubble(x,y,r,vy,vx,life,born){bubbles.push({x,y,r,vy,vx,life,born,ph:Math.random()*6.28,wf:2+Math.random()*4,wa:4+Math.random()*10})}
    // burst from the button
    for(let i=0;i<34;i++){const ang=-Math.PI*Math.random(),sp=120+Math.random()*420;bubble(ox,oy,2+Math.random()*7,Math.sin(ang)*sp-200,Math.cos(ang)*sp,1.4+Math.random(),Math.random()*120)}
    const rays=[...Array(6)].map((_,i)=>({x:30+i*62+Math.random()*30,w:30+Math.random()*50,sk:-60+Math.random()*120,sp:.6+Math.random()}));
    const T=2300,SWITCH=1320;let t0=null,switched=false,spawnAcc=0,last=0;

    function level(t){return H+40-(H+140)*ease.inOut(seg(t,140,1220))}
    function surfaceY(x,t,lv){const a=16*(1-seg(t,900,1250))+3;return lv+Math.sin(x*.028+t*.009)*a+Math.sin(x*.071-t*.014)*a*.45}

    function frame(now){
      if(t0===null)t0=now;const t=now-t0,dt=Math.min(.05,(t-last)/1000);last=t;
      c.clearRect(0,0,W,H);
      const lv=level(t);

      // ripples from tap point
      for(let i=0;i<4;i++){const p=seg(t,i*90,620+i*90);if(p<=0||p>=1)continue;
        c.beginPath();c.ellipse(ox,oy,20+p*260,(20+p*260)*.42,0,0,6.283);
        c.strokeStyle='rgba(191,250,243,'+(0.75*(1-p))+')';c.lineWidth=3*(1-p)+.5;c.stroke()}

      // rising water
      if(lv<H+30){
        c.beginPath();c.moveTo(0,H);
        for(let x=0;x<=W;x+=6)c.lineTo(x,surfaceY(x,t,lv));
        c.lineTo(W,H);c.closePath();
        const g=c.createLinearGradient(0,lv-20,0,lv+H);
        g.addColorStop(0,'rgba(94,230,214,.92)');g.addColorStop(.08,'#1B6A8F');g.addColorStop(.35,'#0A2A43');g.addColorStop(1,'#030C15');
        c.fillStyle=g;c.fill();
        // foam line
        c.beginPath();for(let x=0;x<=W;x+=6){const y=surfaceY(x,t,lv);x?c.lineTo(x,y):c.moveTo(x,y)}
        c.strokeStyle='rgba(232,246,248,.85)';c.lineWidth=3;c.shadowColor='#BFFAF3';c.shadowBlur=14;c.stroke();c.shadowBlur=0;
        // caustics shimmer just under surface
        c.save();c.globalCompositeOperation='lighter';
        for(let i=0;i<9;i++){const x=(i*53+t*.04*(i%2?1:-1))%(W+60)-30,y=lv+30+((i*37)%90);
          c.beginPath();c.ellipse(x,y,26,5,Math.sin(t*.002+i)*.4,0,6.283);c.fillStyle='rgba(191,250,243,.07)';c.fill()}
        c.restore();
      }

      // god rays once underwater
      const ra=seg(t,700,1100)*(1-seg(t,1700,2200));
      if(ra>0){c.save();c.globalCompositeOperation='lighter';
        rays.forEach((r,i)=>{const sway=Math.sin(t*.0012*r.sp+i)*18;const g=c.createLinearGradient(0,0,0,H*.8);
          g.addColorStop(0,'rgba(191,250,243,'+(.22*ra)+')');g.addColorStop(1,'rgba(191,250,243,0)');
          c.beginPath();c.moveTo(r.x+sway,0);c.lineTo(r.x+r.w+sway,0);c.lineTo(r.x+r.w+r.sk*2.4+sway,H*.8);c.lineTo(r.x+r.sk*2.4-r.w*.6+sway,H*.8);c.closePath();c.fillStyle=g;c.fill()});
        c.restore()}

      // spawn bubbles from below while diving
      if(t>200&&t<1900){spawnAcc+=dt*(t<1300?110:60);while(spawnAcc>1){spawnAcc--;const big=Math.random()<.12;
        bubble(Math.random()*W,H+20+Math.random()*60,big?9+Math.random()*12:1.5+Math.random()*6,-(380+Math.random()*700)*(big?.7:1),0,2.5,t)}}

      // reveal: punch a bubble-shaped hole in the deep water
      const rp=seg(t,SWITCH+40,T-120);
      if(rp>0){
        const R=ease.out(rp)*640,cx=W/2,cy=H*.46;
        c.save();c.globalCompositeOperation='destination-out';
        const g=c.createRadialGradient(cx,cy,Math.max(0,R-70),cx,cy,R+1);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
        c.fillStyle=g;c.beginPath();c.arc(cx,cy,R+2,0,6.283);c.fill();
        c.globalAlpha=ease.in(seg(t,T-500,T));c.fillRect(0,0,W,H);
        c.restore();
        // glowing bubble rim
        const ga=1-rp;
        c.beginPath();c.arc(cx,cy,R,0,6.283);c.strokeStyle='rgba(94,230,214,'+(.9*ga)+')';c.lineWidth=4+10*ga;c.shadowColor='#5EE6D6';c.shadowBlur=30;c.stroke();c.shadowBlur=0;
        c.beginPath();c.arc(cx,cy,R*.86,-2.5,-1.7);c.strokeStyle='rgba(232,246,248,'+(.8*ga)+')';c.lineWidth=6*ga+1;c.lineCap='round';c.stroke();
      }

      // bubbles
      for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];if(t<b.born)continue;const age=(t-b.born)/1000;
        b.vy*=b.vx?0.985:1;b.vx*=.96;b.x+=b.vx*dt;b.y+=b.vy*dt;
        if(b.vx===0||Math.abs(b.vx)<1)b.vy=Math.min(b.vy,-260)+(-120*dt);
        const x=b.x+Math.sin(age*b.wf+b.ph)*b.wa;
        const fade=clamp(1-age/b.life)*(1-seg(t,T-450,T));
        if(b.y<-40||fade<=0){bubbles.splice(i,1);continue}
        c.beginPath();c.arc(x,b.y,b.r,0,6.283);
        c.fillStyle='rgba(159,243,234,'+(.12*fade)+')';c.fill();
        c.strokeStyle='rgba(191,250,243,'+(.75*fade)+')';c.lineWidth=Math.max(1,b.r*.16);c.stroke();
        if(b.r>3){c.beginPath();c.arc(x-b.r*.35,b.y-b.r*.35,b.r*.35,3.4,4.8);c.strokeStyle='rgba(255,255,255,'+(.85*fade)+')';c.lineWidth=Math.max(1,b.r*.18);c.stroke()}}

      // depth meter
      const da=seg(t,620,900)*(1-seg(t,SWITCH-120,SWITCH+120));
      if(da>0){const d=Math.round(ease.inOut(seg(t,600,SWITCH))*42);
        c.save();c.globalAlpha=da;c.textAlign='center';c.fillStyle='#E8F6F8';c.shadowColor='rgba(94,230,214,.8)';c.shadowBlur=24;
        c.font="800 64px Sora, Manrope, system-ui, sans-serif";c.fillText('−'+d+' m',W/2,H*.47);
        c.shadowBlur=0;c.font="700 13px Manrope, system-ui, sans-serif";c.fillStyle='rgba(169,203,212,.95)';
        c.fillText('GŁĘBIEJ NIŻ NAGŁÓWEK',W/2,H*.47+34);c.restore()}

      if(!switched&&t>=SWITCH){switched=true;
        for(let i=0;i<40;i++){const ang=Math.random()*6.283,sp=200+Math.random()*500;bubble(W/2+Math.cos(ang)*30,H*.46+Math.sin(ang)*30,2+Math.random()*8,Math.sin(ang)*sp-150,Math.cos(ang)*sp,.9+Math.random()*.6,t)}
        dir=1;if(location.hash!=='#Main')history.pushState(null,'','#Main');show('Main');
        stage.appendChild(cv);
      }
      if(t<T)requestAnimationFrame(frame);else{cv.remove();diving=false}
    }
    requestAnimationFrame(frame);
  }
})();
</script>
